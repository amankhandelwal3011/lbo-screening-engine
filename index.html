const S={tab:0,sel:null,cap:25000,prem:25,fee:2,lev:3,sen:75,rs:10,rj:13,tax:25.17,hold:5,g:8,opm:15,fc:50,ro:20,nd:3,evx:15,mode:'abs',sb:20,sd:10,w:15};
const TABS=['Assumptions','Funnel','LBO engine','Scenarios','Ranking','IC memo'];
const f1=x=>x.toLocaleString('en-IN',{maximumFractionDigits:0}),pc=x=>Number.isFinite(x)?(x*100).toFixed(1)+'%':'n.m.',xx=x=>Number.isFinite(x)?x.toFixed(1)+'x':'n.m.';
const SC=k=>k=='d'?{g:S.g-3,mb:-200,xd:-1}:k=='u'?{g:S.g+2,mb:100,xd:.5}:{};
const IN=(k,l,st=1)=>`<label>${l}<input type=number step=${st} value=${S[k]} onchange="S.${k}=+this.value;R()"></label>`;
const s0=c=>{const r=[];if(c.ev>S.cap)r.push('EV above cap');if(c.o.startsWith('Government'))r.push('Government-owned');if(c.s=='Financials')r.push('Financial');return r};
function model(c,o={}){
 const g=(o.g??S.g)/100,lev=o.lev??S.lev,N=S.hold,mb=(o.mb||0)/1e4,xd=o.xd||0;
 const eq=c.mc*(1+S.prem/100),eev=eq+c.db-c.ca,m0=eev/c.op,fees=S.fee/100*eev,uses=eq+c.db+fees;
 const sd=lev*S.sen/100*c.op,jd=lev*(1-S.sen/100)*c.op,sponRaw=uses-sd-jd-c.ca;
 const nm=sponRaw<0.05*uses;// sponsor cheque too thin (or negative) for debt sized this way - not a workable capital structure
 const spon=Math.max(sponRaw,1);
 const conv=Math.min(Math.max(c.fcf/c.op,0),1),mg=c.opm/100;let sb=sd,jb=jd,rows=[],mn=99,l2=0;
 for(let t=1;t<=N;t++){const e=c.op/mg*Math.pow(1+g,t)*(mg+mb),int=sb*S.rs/100+jb*S.rj/100;
  let pay=e*conv-int*(1-S.tax/100);if(pay<0){sb-=pay;pay=0}
  const ps=Math.min(pay,sb);sb-=ps;jb-=Math.min(pay-ps,jb);const cov=int>0?e/int:99;mn=Math.min(mn,cov);if(t==2)l2=(sb+jb)/e;rows.push({t,e,int,sb,jb,cov})}
 const eN=rows[N-1].e,xm=(o.xm??m0)+xd,xev=xm*eN,xeq=xev-sb-jb;
 const moic=nm?NaN:xeq/spon,irr=nm?NaN:(xeq>0?Math.pow(moic,1/N)-1:-1);
 const a=(eN-c.op)*m0,b=xd*eN;
 return{eq,eev,m0,fees,uses,sd,jd,spon,sponRaw,nm,rows,eN,xm,xev,xeq,moic,irr,mn,l2,a,b,cc:xeq-spon-a-b,flag:nm||l2>6||mn<1.5}}
function pipe(){
 const R0=D.map((c,i)=>({c,i,x:c.ev/c.op,cv:c.fcf/c.op,nd:(c.db-c.ca)/c.op,why:''}));
 const v=R0.filter(r=>!s0(r.c).length).map(r=>r.x).sort((a,b)=>a-b),med=v.length?(v[v.length>>1]+v[(v.length-1)>>1])/2:0,cap=S.mode=='med'?med:S.evx;
 const st=[['Stage 0: deal feasibility',r=>s0(r.c).join(', ')],['EBITDA margin > '+S.opm+'%',r=>r.c.opm>S.opm?'':'margin '+r.c.opm.toFixed(1)+'%'],
 ['FCF conversion > '+S.fc+'%',r=>r.cv*100>S.fc?'':'FCF conv '+(r.cv*100).toFixed(0)+'%'],['ROCE > '+S.ro+'%',r=>r.c.roce>S.ro?'':'ROCE '+r.c.roce.toFixed(0)+'%'],
 ['EV/EBITDA below '+xx(cap)+(S.mode=='med'?' (peer median)':''),r=>r.x<cap?'':'EV/EBITDA '+xx(r.x)],['Net debt/EBITDA < '+S.nd+'x',r=>r.nd<S.nd?'':'ND/EBITDA '+xx(r.nd)]];
 let al=R0.slice();const ct=[['Universe',al.length]];
 st.forEach(([n,f])=>{al=al.filter(r=>{const w=f(r);if(w){r.why=n+' ('+w+')';return false}return true});ct.push([n,al.length])});
 return{R0,al,ct,med}}
function rank(){
 const L=pipe().al.map(r=>({r,b:model(r.c),d:model(r.c,SC('d')),u:model(r.c,SC('u'))}));
 const ok=L.filter(l=>Number.isFinite(l.b.irr)&&Number.isFinite(l.d.irr));
 if(ok.length){
  const n=(k,inv)=>{const v=ok.map(k),lo=Math.min(...v),hi=Math.max(...v);return v.map(y=>hi==lo?50:100*(inv?hi-y:y-lo)/(hi-lo))};
  const a=n(l=>l.b.irr),b=n(l=>l.d.irr),c=n(l=>Math.min(l.r.cv,1)),d=n(l=>l.r.c.roce),e=n(l=>l.r.x,1);
  ok.forEach((l,i)=>{l.sc=.35*a[i]+.25*b[i]+.2*c[i]+.1*d[i]+.1*e[i];l.cl=l.b.irr*100>=S.sb&&l.d.irr*100>=S.sd?'Strong Buy':l.b.irr*100>=S.w?'Watch':'Pass'});
 }
 L.forEach(l=>{if(!Number.isFinite(l.sc)){l.sc=-1;l.cl='n.m.'}});
 return L.sort((x,y)=>y.sc-x.sc)}
const CL={'Strong Buy':'var(--gr)',Watch:'var(--ac)',Pass:'var(--rd)','n.m.':'var(--mu)'};

const heat=(rh,ch,fn)=>`<div class=w><table class=hm><tr><th></th>${ch.map(x=>`<th>${x[0]}</th>`).join('')}</tr>${rh.map(r=>`<tr><th>${r[0]}</th>${ch.map(c=>{const i=fn(r[1],c[1]);const ok=Number.isFinite(i);const bg=ok?`hsl(${Math.max(0,Math.min(1,(i+.05)/.35))*125} 50% 26%)`:'var(--pn2)';return`<td style="background:${bg}" title="${ok?'':'Sponsor equity too thin at this leverage for a meaningful IRR'}">${pc(i)}</td>`}).join('')}</tr>`).join('')}</table></div>`;
const M=t=>`<p class=note><b>Methodology.</b> ${t}</p>`;
function p0(){const P=pipe(),L=rank(),t=L[0];
 return`<div class=kp><div class=k><b>${D.length}</b><span>companies screened</span></div><div class=k><b>${P.ct[1][1]}</b><span>pass Stage 0</span></div><div class=k><b>${P.al.length}</b><span>final shortlist</span></div><div class=k><b class=a>${t?t.r.c.n.split(' (')[0]:'None'}</b><span>top pick${t?' - base IRR '+pc(t.b.irr)+', '+xx(t.b.moic)+' MOIC':''}</span></div></div>
 <h2>Deal assumptions</h2><div class=as>${IN('prem','Control premium (%)')}${IN('fee','Fees (% of EV)',.5)}${IN('lev','Entry leverage (x EBITDA, max 5)',.25)}${IN('sen','Senior share of debt (%)',5)}${IN('rs','Senior rate (%)',.5)}${IN('rj','Junior rate (%)',.5)}${IN('tax','Tax rate (%)',.01)}${IN('hold','Holding period (yrs, 3-7)')}${IN('g','Revenue growth (%)',.5)}${IN('cap','Stage 0 EV cap (₹ Cr)',1000)}</div>
 <h2>Screening thresholds</h2><div class=as>${IN('opm','EBITDA margin >(%)')}${IN('fc','FCF conversion >(%)',5)}${IN('ro','ROCE >(%)')}${IN('nd','Net debt/EBITDA <(x)',.5)}${IN('evx','EV/EBITDA below (x)',.5)}<label>EV/EBITDA rule<select onchange="S.mode=this.value;R()"><option value=abs ${S.mode=='abs'?'selected':''}>Absolute cap</option><option value=med ${S.mode=='med'?'selected':''}>Below peer median</option></select></label>${IN('sb','Strong Buy: base IRR >=(%)')}${IN('sd','Strong Buy: downside IRR >=(%)')}${IN('w','Watch: base IRR >=(%)')}</div>
 ${M('EBITDA = OP 12M; revenue = OP / OPM; net debt = debt - cash. Entry equity = market cap x (1 + premium); existing cash funds part of the deal. Debt is sized on EBITDA, swept 100% from cash flow after tax-adjusted interest (senior first). FCF each year = EBITDA x FCF conversion (0-100%). Exit multiple = entry multiple. IRR = MOIC^(1/years) - 1 with no interim dividends.')}`}
function p1(){const P=pipe(),m=P.ct[0][1];

function p2(){if(S.sel==null)S.sel=(rank()[0]||{r:{i:0}}).r.i;const c=D[S.sel],m=model(c),w=s0(c);
